<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>글로벌 멀티 스위칭 계산기</title>
    <style>
        /* 아이폰 전체 화면에 공백 없이 꽉 차도록 여백 제거 및 스크롤 방지 */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #1c1c1e; 
            overflow: hidden;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; /* 키패드가 화면 아래쪽에 딱 붙도록 배치 */
            box-sizing: border-box;
            padding: 20px;
            /* 아이폰 하단 홈 바(세이프 에어리어) 영역에 대응하여 여백 자동 확보 */
            padding-bottom: calc(20px + env(safe-area-inset-bottom)); 
        }
        
        .calculator { 
            width: 100%; 
            background: #1c1c1e; 
            box-sizing: border-box; 
        }
        
        .display { 
            width: 100%; 
            background: transparent; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            justify-content: flex-end; 
            padding: 10px 5px; 
            box-sizing: border-box; 
            min-height: 140px; 
            margin-bottom: 10px; 
        }
        #screen { color: #aeaeac; font-size: 26px; word-wrap: break-word; text-align: right; width: 100%; min-height: 30px; }
        #sub-numeric { color: #8e8e93; font-size: 18px; margin-top: 6px; font-weight: 300; text-align: right; width: 100%; min-height: 22px; letter-spacing: 0.5px; }
        #result-screen { color: #0a84ff; font-size: 36px; font-weight: bold; margin-top: 12px; text-align: right; width: 100%; }
        .status-bar { width: 100%; display: flex; justify-content: space-between; color: #8e8e93; font-size: 11px; margin-bottom: 8px; padding: 0 4px; box-sizing: border-box; }
        
        .currency-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; width: 100%; }
        .currency-btn { height: 42px; border-radius: 8px; border: none; font-size: 11px; font-weight: bold; background: #2c2c2e; color: #8e8e93; cursor: pointer; transition: all 0.2s; }
        .currency-btn.active { background: #0a84ff; color: white; }
        
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; }
        
        /* [중요] touch-action: manipulation을 통해 브라우저의 0.3초 타이밍 간보기를 없애고 즉각 반응하게 만듦 */
        button { 
            height: 54px; 
            border-radius: 50px; 
            border: none; 
            font-size: 19px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.1s; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; 
        }
        button:active { filter: brightness(1.3); }
        
        .num { background: #333333; color: white; }
        .unit { background: #48484a; color: #ff9f0a; } 
        .op { background: #ff9f0a; color: white; }    
        .ctrl { background: #a5a5a5; color: black; }   
    </style>
</head>
<body>

<div class="calculator">
    <div class="display">
        <div id="screen">0</div>
        <div id="sub-numeric">0</div>
        <div id="result-screen">0 원</div>
    </div>

    <div class="status-bar">
        <span>현재 환율 모드</span>
        <span id="rate-timestamp">환율 로딩 중...</span>
    </div>

    <div class="currency-bar">
        <button id="mode-KRW" class="currency-btn active" onclick="switchOutputCurrency('KRW')">KRW (원)</button>
        <button id="mode-USD" class="currency-btn" onclick="switchOutputCurrency('USD')">USD ($)</button>
        <button id="mode-EUR" class="currency-btn" onclick="switchOutputCurrency('EUR')">EUR (€)</button>
        <button id="mode-JPY" class="currency-btn" onclick="switchOutputCurrency('JPY')">JPY (￥)</button>
        <button id="mode-CNY" class="currency-btn" onclick="switchOutputCurrency('CNY')">CNY (元)</button>
    </div>

    <div class="grid">
        <button class="num" onclick="pressNum('7')">7</button>
        <button class="num" onclick="pressNum('8')">8</button>
        <button class="num" onclick="pressNum('9')">9</button>
        <button class="ctrl" onclick="pressBackspace()">⌫</button>
        <button class="op" onclick="pressOp(' ÷ ')">÷</button>

        <button class="num" onclick="pressNum('4')">4</button>
        <button class="num" onclick="pressNum('5')">5</button>
        <button class="num" onclick="pressNum('6')">6</button>
        <button class="ctrl" onclick="clearScreen()">C</button>
        <button class="op" onclick="pressOp(' × ')">×</button>

        <button class="num" onclick="pressNum('1')">1</button>
        <button class="num" onclick="pressNum('2')">2</button>
        <button class="num" onclick="pressNum('3')">3</button>
        <button class="num" onclick="pressNum('00')">00</button>
        <button class="op" onclick="pressOp(' - ')">-</button>

        <button class="num" onclick="pressNum('0')">0</button>
        <button class="num" onclick="pressNum('.')">.</button>
        <button class="unit" onclick="pressUnit('십')">십</button>
        <button class="unit" onclick="pressUnit('백')">백</button>
        <button class="op" onclick="pressOp(' + ')">+</button>

        <button class="unit" style="grid-column: span 2; border-radius: 15px;" onclick="pressUnit('만')">만</button>
        <button class="unit" style="grid-column: span 1; border-radius: 15px;" onclick="pressUnit('천')">천</button>
        <button class="unit" style="grid-column: span 1; border-radius: 15px;" onclick="pressUnit('억')">억</button>
        <button class="op" style="border-radius: 15px;" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let inputString = "0";      
    let targetCurrency = "KRW"; 
    let isCalculated = false;   
    let currentRawResult = 0;   

    let exchangeRates = { 'KRW': 1, 'USD': 1380, 'EUR': 1490, 'JPY': 8.8, 'CNY': 190 }; 
    const currencySymbols = { 'KRW': '원', 'USD': '달러 ($)', 'EUR': '유로 (€)', 'JPY': '엔 (￥)', 'CNY': '위안 (元)' };
    const modeIds = { 'KRW': 'mode-KRW', 'USD': 'mode-USD', 'EUR': 'mode-EUR', 'JPY': 'mode-JPY', 'CNY': 'mode-CNY' };

    async function fetchRealTimeRates() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/KRW');
            if (!response.ok) throw new Error();
            const data = await response.json();
            exchangeRates['USD'] = 1 / data.rates.USD;
            exchangeRates['EUR'] = 1 / data.rates.EUR;
            exchangeRates['CNY'] = 1 / data.rates.CNY;
            exchangeRates['JPY'] = 1 / data.rates.JPY;
            document.getElementById('rate-timestamp').innerText = "실시간 환율 동기화 완료";
        } catch (e) {
            document.getElementById('rate-timestamp').innerText = "기본 내장 환율로 작동 중";
        }
    }

    window.onload = function() {
        fetchRealTimeRates();
    };

    function switchOutputCurrency(currency) {
        targetCurrency = currency;
        for (let key in modeIds) {
            let btn = document.getElementById(modeIds[key]);
            if (key === currency) btn.classList.add('active');
            else btn.classList.remove('active');
        }
        if (currentRawResult > 0 || isCalculated) {
            renderFinalResult();
        }
    }

    function pressNum(val) {
        if (isCalculated) {
            inputString = (val === ".") ? "0." : val;
            isCalculated = false;
        } else {
            if (inputString === "0") {
                if (val === "00") return;
                inputString = (val === ".") ? "0." : val;
            } else {
                inputString += val;
            }
        }
        renderScreen();
    }

    function pressUnit(unit) {
        if (isCalculated) isCalculated = false; 
        if (inputString === "0" || inputString.endsWith(' ')) return;

        let match = inputString.match(/[0-9.]+$/);
        if (match) {
            let lastNumStr = match[0];
            if ((unit === '십' || unit === '백' || unit === '천') && lastNumStr.length > 1) {
                return; 
            }
        }
        inputString += unit;
        renderScreen();
    }

    function pressOp(op) {
        if (inputString === "0" && currentRawResult === 0) return;
        if (isCalculated) {
            inputString = currentRawResult.toString() + op;
            isCalculated = false;
        } else {
            if (inputString.endsWith(' ')) return; 
            inputString += op;
        }
        renderScreen();
    }

    function pressBackspace() {
        if (inputString === "0") return;
        if (isCalculated) { clearScreen(); return; } 
        if (inputString.endsWith(' ')) {
            inputString = inputString.slice(0, -3); 
        } else {
            inputString = inputString.slice(0, -1);
        }
        if (inputString === "" || inputString === " ") inputString = "0";
        renderScreen();
    }

    function clearScreen() {
        inputString = "0";
        isCalculated = false;
        currentRawResult = 0;
        document.getElementById("screen").innerText = "0";
        document.getElementById("sub-numeric").innerText = "0";
        document.getElementById("result-screen").innerText = "0 원";
        switchOutputCurrency('KRW'); 
    }

    function renderScreen() {
        document.getElementById("screen").innerText = inputString;
        updateSubNumeric();
    }

    function parseToPureNumericExpression(str) {
        let formula = str.replace(/×/g, '*').replace(/÷/g, '/');
        let chunkRegex = /([0-9.]+(?:억|만|천|백|십|[0-9.])+)/g;
        formula = formula.replace(chunkRegex, function(match) {
            if (match === ".") return "0";
            return decodeKoreanDigits(match).toString();
        });
        return formula;
    }

    function decodeKoreanDigits(chunk) {
        if (!isNaN(chunk)) return parseFloat(chunk) || 0;
        let total = 0;
        let regex = /([0-9.]+)|(억|만|천|백|십)/g;
        let match;
        let currentNum = 0;
        let currentGroupSum = 0; 

        while ((match = regex.exec(chunk)) !== null) {
            if (match[1]) { 
                currentNum = parseFloat(match[1]);
            } else if (match[2]) { 
                let unit = match[2];
                if (unit === '십') { currentGroupSum += (currentNum || 1) * 10; currentNum = 0; }
                else if (unit === '백') { currentGroupSum += (currentNum || 1) * 100; currentNum = 0; }
                else if (unit === '천') { currentGroupSum += (currentNum || 1) * 1000; currentNum = 0; }
                else if (unit === '만') {
                    currentGroupSum += currentNum;
                    total += (currentGroupSum || 1) * 10000;
                    currentGroupSum = 0;
                    currentNum = 0;
                }
                else if (unit === '억') {
                    currentGroupSum += currentNum;
                    total += (currentGroupSum || 1) * 100000000;
                    currentGroupSum = 0;
                    currentNum = 0;
                }
            }
        }
        total += currentGroupSum + currentNum; 
        return total;
    }

    function updateSubNumeric() {
        if (inputString === "0") {
            document.getElementById("sub-numeric").innerText = "0";
            return;
        }
        try {
            let pureNumericFormula = parseToPureNumericExpression(inputString);
            let displayFormula = pureNumericFormula
                .replace(/\*/g, ' × ')
                .replace(/\//g, ' ÷ ')
                .replace(/\+/g, ' + ')
                .replace(/\-/g, ' - ');
            
            displayFormula = displayFormula.replace(/[0-9.]+/g, function(num) {
                return Number(num).toLocaleString(undefined, { maximumFractionDigits: 4 });
            });
            document.getElementById("sub-numeric").innerText = displayFormula;
        } catch(e) {
            document.getElementById("sub-numeric").innerText = "입력 중...";
        }
    }

    function calculate() {
        try {
            let executableFormula = parseToPureNumericExpression(inputString);
            let result = Function('"use strict";return (' + executableFormula + ')')();
            if (isNaN(result) || !isFinite(result)) throw new Error();
            currentRawResult = result; 
            renderFinalResult();       
            isCalculated = true; 
        } catch (e) {
            document.getElementById("result-screen").innerText = "계산 오류";
        }
    }

    function renderFinalResult() {
        let rate = exchangeRates[targetCurrency];
        let convertedValue = currentRawResult / rate;
        let formatted = "";
        if (targetCurrency === 'KRW') {
            formatted = Math.round(convertedValue).toLocaleString();
        } else {
            formatted = convertedValue.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        document.getElementById("result-screen").innerText = formatted + " " + currencySymbols[targetCurrency];
    }
</script>
</body>
</html>
