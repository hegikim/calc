<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>글로벌 멀티 스위칭 계산기</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #000000; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .calculator { 
            width: 100%; 
            max-width: 480px; 
            height: 100%;
            max-height: 900px;
            background: #1c1c1e; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            border-radius: 0;
        }
        
        @media (min-width: 481px) {
            html, body { align-items: center; background: #2c2c2e; }
            .calculator { height: 95%; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        }
        
        .display { 
            width: 100%; 
            background: transparent; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            justify-content: flex-end; 
            padding: 10px 5px; 
            box-sizing: border-box; 
            min-height: 160px; 
            margin-bottom: 10px; 
        }
        #screen { color: #aeaeac; font-size: 26px; word-wrap: break-word; text-align: right; width: 100%; min-height: 30px; }
        #sub-numeric { color: #8e8e93; font-size: 18px; margin-top: 6px; font-weight: 300; text-align: right; width: 100%; min-height: 22px; letter-spacing: 0.5px; }
        #result-screen { color: #0a84ff; font-size: 36px; font-weight: bold; margin-top: 12px; text-align: right; width: 100%; }
        .status-bar { width: 100%; display: flex; justify-content: space-between; color: #8e8e93; font-size: 11px; margin-bottom: 8px; padding: 0 4px; box-sizing: border-box; }
        
        .currency-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; width: 100%; }
        .currency-btn { height: 42px; border-radius: 8px; border: none; font-size: 11px; font-weight: bold; background: #2c2c2e; color: #8e8e93; cursor: pointer; transition: all 0.2s; }
        .currency-btn.active { background: #0a84ff; color: white; }
        
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; }
        button { 
            height: 54px; 
            border-radius: 50px; 
            border: none; 
            font-size: 19px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.1s; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; 
        }
        button:active { filter: brightness(1.3); }
        .num { background: #333333; color: white; }
        .unit { background: #48484a; color: #ff9f0a; } 
        .op { background: #ff9f0a; color: white; }    
        .ctrl { background: #a5a5a5; color: black; }   
    </style>
</head>
<body>

<div class="calculator">
    <div class="display">
        <div id="screen">0</div>
        <div id="sub-numeric">0 원</div>
        <div id="result-screen">0 원</div>
    </div>

    <div class="status-bar">
        <span>현재 입력 통화 기준</span>
        <span id="rate-timestamp">환율 로딩 중...</span>
    </div>

    <div class="currency-bar">
        <button id="mode-KRW" class="currency-btn active" onclick="switchCurrencyMode('KRW')">KRW (원)</button>
        <button id="mode-USD" class="currency-btn" onclick="switchCurrencyMode('USD')">USD ($)</button>
        <button id="mode-EUR" class="currency-btn" onclick="switchCurrencyMode('EUR')">EUR (€)</button>
        <button id="mode-JPY" class="currency-btn" onclick="switchCurrencyMode('JPY')">JPY (￥)</button>
        <button id="mode-CNY" class="currency-btn" onclick="switchCurrencyMode('CNY')">CNY (元)</button>
    </div>

    <div class="grid">
        <button class="num" onclick="pressNum('7')">7</button>
        <button class="num" onclick="pressNum('8')">8</button>
        <button class="num" onclick="pressNum('9')">9</button>
        <button class="ctrl" onclick="pressBackspace()">⌫</button>
        <button class="op" onclick="pressOp(' ÷ ')">÷</button>

        <button class="num" onclick="pressNum('4')">4</button>
        <button class="num" onclick="pressNum('5')">5</button>
        <button class="num" onclick="pressNum('6')">6</button>
        <button class="ctrl" onclick="clearScreen()">C</button>
        <button class="op" onclick="pressOp(' × ')">×</button>

        <button class="num" onclick="pressNum('1')">1</button>
        <button class="num" onclick="pressNum('2')">2</button>
        <button class="num" onclick="pressNum('3')">3</button>
        <button class="num" onclick="pressNum('00')">00</button>
        <button class="op" onclick="pressOp(' - ')">-</button>

        <button class="num" onclick="pressNum('0')">0</button>
        <button class="num" onclick="pressNum('.')">.</button>
        <button class="unit" onclick="pressUnit('십')">십</button>
        <button class="unit" onclick="pressUnit('백')">백</button>
        <button class="op" onclick="pressOp(' + ')">+</button>

        <button class="unit" style="grid-column: span 2; border-radius: 15px;" onclick="pressUnit('만')">만</button>
        <button class="unit" style="grid-column: span 1; border-radius: 15px;" onclick="pressUnit('천')">천</button>
        <button class="unit" style="grid-column: span 1; border-radius: 15px;" onclick="pressUnit('억')">억</button>
        <button class="op" style="border-radius: 15px;" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let inputString = "0";      
    let currentCurrency = "KRW"; 
    let isCalculated = false;   
    let calculatedRawResult = 0; 

    // 기본 고정 환율 테이블 (네트워크 차단 등 예외 상황 방어용)
    let exchangeRates = { 'KRW': 1, 'USD': 1550, 'EUR': 1680, 'JPY': 9.8, 'CNY': 210 }; 
    const currencySymbols = { 'KRW': '원', 'USD': '달러 ($)', 'EUR': '유로 (€)', 'JPY': '엔 (￥)', 'CNY': '위안 (元)' };
    const currencySigns = { 'KRW': '', 'USD': '$ ', 'EUR': '€ ', 'JPY': '￥ ', 'CNY': '元 ' };
    const currencyTexts = { 'KRW': '원', 'USD': '달러', 'EUR': '유로', 'JPY': '엔', 'CNY': '위안' };
    const modeIds = { 'KRW': 'mode-KRW', 'USD': 'mode-USD', 'EUR': 'mode-EUR', 'JPY': 'mode-JPY', 'CNY': 'mode-CNY' };

    // [로직 변경] 6시간 주기 정방향 고속 API로 수집 엔진 전면 교체
    async function fetchRealTimeRates() {
        try {
            const response = await fetch('https://v6.exchangerate-api.com/v6/60076a5b6f37622cba28399e/latest/USD');
            if (!response.ok) throw new Error();
            const data = await response.json();
            
            let rates = data.conversion_rates;
            
            // 정방향 연산 설계: 원화 가치를 달러 기준으로 표준화하여 오차 제로화
            exchangeRates['USD'] = rates.KRW; 
            exchangeRates['EUR'] = rates.KRW / rates.EUR;
            exchangeRates['CNY'] = rates.KRW / rates.CNY;
            exchangeRates['JPY'] = (rates.KRW / rates.JPY) * 100; // 100엔 환산 보정값 처리
            
            document.getElementById('rate-timestamp').innerText = "6시간 주기 고속 동기화 완료";
        } catch (e) {
            document.getElementById('rate-timestamp').innerText = "내장 기본 환율 정보 연동 중";
        }
    }

    window.onload = function() {
        fetchRealTimeRates();
        renderScreen();
    };

    function switchCurrencyMode(targetCurrency) {
        if (currentCurrency === targetCurrency) return;

        let previousCurrency = currentCurrency;
        currentCurrency = targetCurrency;

        for (let key in modeIds) {
            let btn = document.getElementById(modeIds[key]);
            if (key === targetCurrency) btn.classList.add('active');
            else btn.classList.remove('active');
        }

        if (isCalculated || calculatedRawResult > 0) {
            // 원화 표준 가치 보정 연산
            let baseKrwFactor = (previousCurrency === 'JPY') ? 100 : 1;
            let targetKrwFactor = (targetCurrency === 'JPY') ? 100 : 1;

            let krwValue = calculatedRawResult * (exchangeRates[previousCurrency] / baseKrwFactor);
            calculatedRawResult = krwValue / (exchangeRates[targetCurrency] / targetKrwFactor);
            renderFinalResult();
        }
        
        renderScreen();
    }

    function pressNum(val) {
        if (isCalculated) {
            inputString = (val === ".") ? "0." : val;
            isCalculated = false;
            calculatedRawResult = 0;
        } else {
            if (inputString === "0") {
                if (val === "00") return;
                inputString = (val === ".") ? "0." : val;
            } else {
                inputString += val;
            }
        }
        renderScreen();
    }

    function pressUnit(unit) {
        if (isCalculated) {
            isCalculated = false;
            calculatedRawResult = 0;
        }
        if (inputString === "0" || inputString.endsWith(' ')) return;

        let match = inputString.match(/[0-9.]+$/);
        if (match) {
            let lastNumStr = match[0];
            if ((unit === '십' || unit === '백' || unit === '천') && lastNumStr.length > 1) {
                return; 
            }
        }
        inputString += unit;
        renderScreen();
    }

    function pressOp(op) {
        if (inputString === "0" && calculatedRawResult === 0) return;
        if (isCalculated) {
            inputString = calculatedRawResult.toFixed(2).replace(/\.00$/, '') + op;
            isCalculated = false;
            calculatedRawResult = 0;
        } else {
            if (inputString.endsWith(' ')) return; 
            inputString += op;
        }
        renderScreen();
    }

    function pressBackspace() {
        if (inputString === "0") return;
        if (isCalculated) { clearScreen(); return; } 
        if (inputString.endsWith(' ')) {
            inputString = inputString.slice(0, -3); 
        } else {
            inputString = inputString.slice(0, -1);
        }
        if (inputString === "" || inputString === " ") inputString = "0";
        renderScreen();
    }

    function clearScreen() {
        inputString = "0";
        isCalculated = false;
        calculatedRawResult = 0;
        currentCurrency = "KRW";
        for (let key in modeIds) {
            let btn = document.getElementById(modeIds[key]);
            if (key === 'KRW') btn.classList.add('active');
            else btn.classList.remove('active');
        }
        renderScreen();
        document.getElementById("result-screen").innerText = "0 원";
    }

    function renderScreen() {
        let sign = currencySigns[currentCurrency];
        
        if (isCalculated) {
            document.getElementById("screen").innerText = sign + calculatedRawResult.toLocaleString(undefined, { maximumFractionDigits: 4 });
        } else {
            let parts = inputString.split(/([÷×\-+])/);
            let formattedDisplay = parts.map(part => {
                let trimmed = part.trim();
                if (trimmed && /^[0-9.억만천백십]+$/.test(trimmed)) {
                    return sign + trimmed;
                }
                return part;
            }).join('');
            document.getElementById("screen").innerText = formattedDisplay;
        }
        
        updateSubNumeric();
    }

    function parseToPureNumericExpression(str) {
        let formula = str.replace(/×/g, '*').replace(/÷/g, '/');
        let chunkRegex = /([0-9.]+(?:억|만|천|백|십|[0-9.])+)/g;
        formula = formula.replace(chunkRegex, function(match) {
            if (match === ".") return "0";
            return decodeKoreanDigits(match).toString();
        });
        return formula;
    }

    function decodeKoreanDigits(chunk) {
        if (!isNaN(chunk)) return parseFloat(chunk) || 0;
        let total = 0;
        let regex = /([0-9.]+)|(억|만|천|백|십)/g;
        let match;
        let currentNum = 0;
        let currentGroupSum = 0; 

        while ((match = regex.exec(chunk)) !== null) {
            if (match[1]) { 
                currentNum = parseFloat(match[1]);
            } else if (match[2]) { 
                let unit = match[2];
                if (unit === '십') { currentGroupSum += (currentNum || 1) * 10; currentNum = 0; }
                else if (unit === '백') { currentGroupSum += (currentNum || 1) * 100; currentNum = 0; }
                else if (unit === '천') { currentGroupSum += (currentNum || 1) * 1000; currentNum = 0; }
                else if (unit === '만') {
                    currentGroupSum += currentNum;
                    total += (currentGroupSum || 1) * 10000;
                    currentGroupSum = 0;
                    currentNum = 0;
                }
                else if (unit === '억') {
                    currentGroupSum += currentNum;
                    total += (currentGroupSum || 1) * 100000000;
                    currentGroupSum = 0;
                    currentNum = 0;
                }
            }
        }
        total += currentGroupSum + currentNum; 
        return total;
    }

    function updateSubNumeric() {
        if (inputString === "0") {
            document.getElementById("sub-numeric").innerText = "0 " + currencyTexts[currentCurrency];
            return;
        }
        try {
            let pureNumericFormula = parseToPureNumericExpression(inputString);
            let displayFormula = pureNumericFormula
                .replace(/\*/g, ' × ')
                .replace(/\//g, ' ÷ ')
                .replace(/\+/g, ' + ')
                .replace(/\-/g, ' - ');
            
            displayFormula = displayFormula.replace(/[0-9.]+/g, function(num) {
                return Number(num).toLocaleString(undefined, { maximumFractionDigits: 4 });
            });
            document.getElementById("sub-numeric").innerText = displayFormula + " " + currencyTexts[currentCurrency];
        } catch(e) {
            document.getElementById("sub-numeric").innerText = "입력 중...";
        }
    }

    function calculate() {
        try {
            let executableFormula = parseToPureNumericExpression(inputString);
            let result = Function('"use strict";return (' + executableFormula + ')')();
            if (isNaN(result) || !isFinite(result)) throw new Error();
            
            calculatedRawResult = result; 
            renderFinalResult();       
            isCalculated = true; 
        } catch (e) {
            document.getElementById("result-screen").innerText = "계산 오류";
        }
    }

    function renderFinalResult() {
        let formatted = "";
        if (currentCurrency === 'KRW') {
            formatted = Math.round(calculatedRawResult).toLocaleString();
        } else {
            formatted = calculatedRawResult.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        document.getElementById("result-screen").innerText = formatted + " " + currencySymbols[currentCurrency];
    }
</script>
</body>
</html>
